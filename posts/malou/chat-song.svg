  <circle cx="692" cy="78" r="16" fill="#ff6b57"/>
  <text x="692" y="83" text-anchor="middle" fill="#1a100e" font-family="Microsoft YaHei, sans-serif" font-size="12">南</text>
  <text x="666" y="70" text-anchor="end" fill="#9a8d82" font-family="Microsoft YaHei, sans-serif" font-size="12">小南</text>
  <rect x="430" y="86" width="236" height="46" rx="14" fill="#ff6b57"/>
  <text x="548" y="115" text-anchor="middle" fill="#1a100e" font-family="Cascadia Mono, Consolas, monospace" font-size="18">/今日舞萌</text>
  <circle cx="44" cy="168" r="16" fill="#f6f1ea"/>
