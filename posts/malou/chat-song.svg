  <text x="94" y="214" fill="#f6f1ea" font-family="Palatino, Songti SC, serif" font-size="26">今日舞萌</text>
  <text x="94" y="242" fill="#9a8d82" font-family="Microsoft YaHei, sans-serif" font-size="13">按人和日期生成，每天一张</text>
  <rect x="94" y="264" width="220" height="78" rx="12" fill="#1c1916"/>
  <text x="110" y="296" fill="#ff6b57" font-family="Microsoft YaHei, sans-serif" font-size="15">宜</text>
