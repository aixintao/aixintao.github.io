    <rect x="94" y="390" width="52" height="48" rx="6" fill="#f6f1ea"/><text x="120" y="420" fill="#1a100e">中</text>
    <rect x="156" y="390" width="52" height="48" rx="6" fill="#f6f1ea"/><text x="182" y="420" fill="#c23b32">發</text>
