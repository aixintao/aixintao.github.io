<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" role="img">
  <title>看板页面示意</title>
  <rect width="880" height="680" rx="18" fill="#161311"/>
  <text x="36" y="42" fill="#ffb1a3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">页面示意图 · 数字均为示意</text>
  <text x="36" y="78" fill="#f6f1ea" font-family="Palatino, Songti SC, serif" font-size="28">一个 HTML，算在浏览器里</text>

  <rect x="36" y="104" width="808" height="488" rx="16" fill="#1a1614" stroke="#3a312b"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="62" y="142" fill="#f6f1ea" font-size="17">大哥看板</text>
    <text x="818" y="142" fill="#9a8d82" font-size="12" text-anchor="end">示例市场 · 更新于 ——</text>
    <path d="M60 160 H820" stroke="#2a2420" stroke-width="1"/>

    <rect x="60" y="176" width="170" height="34" rx="10" fill="#241e1a" stroke="#3a312b"/>
    <text x="145" y="198" fill="#ffd2cb" font-size="12" text-anchor="middle">大R · 门槛最高</text>
    <rect x="246" y="176" width="170" height="34" rx="10" fill="#241e1a" stroke="#3a312b"/>
    <text x="331" y="198" fill="#c9bdb2" font-size="12" text-anchor="middle">中R · 连续 N 日</text>
    <rect x="432" y="176" width="170" height="34" rx="10" fill="#241e1a" stroke="#3a312b"/>
    <text x="517" y="198" fill="#c9bdb2" font-size="12" text-anchor="middle">小R · 其余</text>

    <rect x="60" y="226" width="72" height="26" rx="13" fill="none" stroke="#3a312b"/>
    <text x="96" y="244" fill="#9a8d82" font-size="11" text-anchor="middle">地区</text>
    <rect x="140" y="226" width="72" height="26" rx="13" fill="none" stroke="#3a312b"/>
    <text x="176" y="244" fill="#9a8d82" font-size="11" text-anchor="middle">截至日</text>
    <rect x="220" y="226" width="72" height="26" rx="13" fill="none" stroke="#3a312b"/>
    <text x="256" y="244" fill="#9a8d82" font-size="11" text-anchor="middle">对比</text>
    <rect x="300" y="226" width="72" height="26" rx="13" fill="none" stroke="#3a312b"/>
    <text x="336" y="244" fill="#9a8d82" font-size="11" text-anchor="middle">口径</text>

    <g fill="#241e1a" stroke="#2a2420">
      <rect x="60" y="268" width="115" height="64" rx="12"/>
      <rect x="189" y="268" width="115" height="64" rx="12"/>
      <rect x="318" y="268" width="115" height="64" rx="12"/>
      <rect x="447" y="268" width="115" height="64" rx="12"/>
      <rect x="576" y="268" width="115" height="64" rx="12"/>
      <rect x="705" y="268" width="115" height="64" rx="12"/>
    </g>
    <g fill="#9a8d82" font-size="11">
      <text x="76" y="290">大R 人数</text>
      <text x="205" y="290">近 7 日充值</text>
      <text x="334" y="290">付费人数</text>
      <text x="463" y="290">客单倍率</text>
      <text x="592" y="290">活跃率</text>
      <text x="721" y="290">流失预警</text>
    </g>
    <g fill="#f6f1ea" font-size="18">
      <text x="76" y="318">12</text>
      <text x="205" y="318">¥ —</text>
      <text x="334" y="318">—</text>
      <text x="463" y="318">×1.4</text>
      <text x="592" y="318">86%</text>
      <text x="721" y="318">3</text>
    </g>

    <rect x="60" y="352" width="520" height="150" rx="12" fill="#1a1614" stroke="#2a2420"/>
    <g stroke="#241f1b" stroke-width="1">
      <path d="M80 392 H560"/>
      <path d="M80 424 H560"/>
      <path d="M80 456 H560"/>
    </g>
    <polyline points="80,470 130,455 180,462 230,432 280,440 330,410 380,420 430,392 480,400 530,372 560,366" fill="none" stroke="#ff6b57" stroke-width="2"/>
    <text x="80" y="378" fill="#9a8d82" font-size="11">近 30 日充值趋势</text>

    <rect x="600" y="352" width="220" height="150" rx="12" fill="#1a1614" stroke="#2a2420"/>
    <text x="620" y="378" fill="#9a8d82" font-size="11">金钻持有（前向填充）</text>
    <rect x="620" y="392" width="90" height="10" rx="5" fill="#ff6b57" opacity="0.85"/>
    <rect x="620" y="418" width="132" height="10" rx="5" fill="#ff6b57" opacity="0.6"/>
    <rect x="620" y="444" width="72" height="10" rx="5" fill="#ff6b57" opacity="0.4"/>
    <text x="620" y="484" fill="#9a8d82" font-size="11">当天没记录，不等于 0</text>

    <rect x="60" y="520" width="150" height="36" rx="10" fill="#3a221c" stroke="#ff6b57"/>
    <text x="135" y="543" fill="#ffd2cb" font-size="12" text-anchor="middle">大R 名册</text>
    <rect x="222" y="520" width="150" height="36" rx="10" fill="#241e1a" stroke="#3a312b"/>
    <text x="297" y="543" fill="#c9bdb2" font-size="12" text-anchor="middle">单人钻取</text>
    <rect x="384" y="520" width="150" height="36" rx="10" fill="#241e1a" stroke="#3a312b"/>
    <text x="459" y="543" fill="#c9bdb2" font-size="12" text-anchor="middle">时段对比</text>
    <rect x="546" y="520" width="150" height="36" rx="10" fill="#241e1a" stroke="#3a312b"/>
    <text x="621" y="543" fill="#c9bdb2" font-size="12" text-anchor="middle">流失预警</text>

    <text x="60" y="580" fill="#9a8d82" font-size="12">改一个阈值，全页立刻重算；任一状态都能用一条带参数的链接打开。</text>
  </g>
  <text x="36" y="628" fill="#9a8d82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">版式、人数和金额都是示意的。真实页面和真实数据只在内网。</text>
</svg>
