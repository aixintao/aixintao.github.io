<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img">
  <title>恶民身份循环</title>
  <rect width="880" height="620" rx="18" fill="#161311"/>
  <text x="36" y="42" fill="#ffb1a3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">玩法示意图</text>
  <text x="36" y="78" fill="#f6f1ea" font-family="Palatino, Songti SC, serif" font-size="28">放弃便利，换一段可被追杀的时间</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="36" y="112" width="190" height="92" rx="14" fill="#241e1a" stroke="#3a312b"/>
    <text x="131" y="148" fill="#f6f1ea" font-size="16">良民</text>
    <text x="131" y="174" fill="#c9bdb2" font-size="13">确认后才转职</text>
    <rect x="268" y="112" width="220" height="92" rx="14" fill="#3a221c" stroke="#ff6b57"/>
    <text x="378" y="148" fill="#f6f1ea" font-size="16">在逃恶民</text>
    <text x="378" y="174" fill="#ffd2cb" font-size="13">红名，坐标会通报</text>
    <rect x="530" y="112" width="314" height="92" rx="14" fill="#241e1a" stroke="#3a312b"/>
    <text x="687" y="148" fill="#f6f1ea" font-size="16">死亡即入狱</text>
    <text x="687" y="174" fill="#c9bdb2" font-size="13">背包掉光，赏金交给击杀者</text>
  </g>
  <g fill="none" stroke="#ff6b57" stroke-width="1.5">
    <path d="M226 158 H268"/>
    <path d="M488 158 H530"/>
    <path d="M687 204 V248"/>
  </g>
  <rect x="36" y="248" width="808" height="168" rx="14" fill="#241e1a" stroke="#3a312b"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#f6f1ea">
    <text x="56" y="286">在逃时不能交易、不能自己传送，原有领地清掉，也不能新建。</text>
    <text x="56" y="320">别人的领地只有领主在线才挖得动。领主离线，破坏会被取消。</text>
    <text x="56" y="354">战斗标记 20 秒。标记还在时掉线或跨世界，直接处死。</text>
    <text x="56" y="388" fill="#c9bdb2">刑满，或走完监狱里的两条路，才变回良民。释放次数会累加。</text>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="36" y="440" width="390" height="140" rx="14" fill="#241e1a" stroke="#3a312b"/>
    <text x="56" y="476" fill="#ffb1a3" font-size="13">赏金</text>
    <text x="56" y="510" fill="#f6f1ea" font-size="18">在逃天数 × 30</text>
    <text x="56" y="542" fill="#c9bdb2" font-size="14">不满 1 天是 0，上限 5000 银币</text>
    <rect x="454" y="440" width="390" height="140" rx="14" fill="#241e1a" stroke="#3a312b"/>
    <text x="474" y="476" fill="#ffb1a3" font-size="13">黑市</text>
    <text x="474" y="510" fill="#f6f1ea" font-size="18">每天 18:00–22:00</text>
    <text x="474" y="542" fill="#c9bdb2" font-size="14">恶民免费进。良民进门 1000 银币</text>
  </g>
</svg>
