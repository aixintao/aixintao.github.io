<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img">
  <title>计费管理系统主菜单</title>
  <rect width="880" height="560" rx="18" fill="#161311"/>
  <text x="36" y="42" fill="#ffb1a3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">界面示意图 · 主菜单</text>
  <text x="36" y="78" fill="#f6f1ea" font-family="Palatino, Songti SC, serif" font-size="28">一个数字进一个子菜单</text>
  <rect x="36" y="104" width="808" height="420" rx="14" fill="#100e0c" stroke="#3a312b"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#f6f1ea">
    <text x="64" y="150" font-size="16" fill="#9a8d82">================================================</text>
    <text x="64" y="186" font-size="20">欢迎使用计费管理系统！</text>
    <text x="64" y="236" font-size="18">1) 上下机管理</text>
    <text x="430" y="236" font-size="18">2) 费用管理</text>
    <text x="64" y="274" font-size="18">3) 计费标准管理</text>
    <text x="430" y="274" font-size="18">4) 卡管理</text>
    <text x="64" y="312" font-size="18">5) 黑名单查询</text>
    <text x="430" y="312" font-size="18">6) 会员系统</text>
    <text x="64" y="350" font-size="18">7) 查询统计</text>
    <text x="430" y="350" font-size="18">8) 管理员系统</text>
    <text x="64" y="388" font-size="18">9) 关于本程序</text>
    <text x="430" y="388" font-size="18">0) 退出系统</text>
    <text x="64" y="444" font-size="18" fill="#ffb1a3">请选择：1</text>
  </g>
  <text x="64" y="490" fill="#c9bdb2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">子菜单里带 * 的项要先登录管理员。输错范围会重新问，不会把非法输入记进去。</text>
</svg>
